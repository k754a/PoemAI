<!DOCTYPE html>
<html lang="en">
    <head>
        <title>PoemAI</title>
          <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
   
    <body>
        <div class = "input-container">
            <form id="form" action="/generate" method="POST" onsubmit="generatePoem(event)">
                <input 
                    type="text" 
                    class="single-word-input" 
                    pattern ="^\S+$" 
                    placeholder="Enter a single word..." 
                    maxlength="30"
                    name="word"
                    autocomplete="off"
                    spellcheck="false"
                    required>
               
                <!-- <button type = "submit">
                    <p id ="Generate">Generate</p>
                </button> -->
                    
            </form>
        </div>


        <div class = "poem-container">
            <p id ="Poetry" ></p>
            <div class = "copy-container">
                <button type = "copy" onclick="copyToClipboard()">

                </button>
            </div>
        </div>
        
      

        <div class = "bottom-container">
            <p id ="SideNote" >This is a small model, while it has a semblance of rhyming, it does NOT produce coherent or meaningful text.</p>

                <button type = "stardance" onclick="window.open('https://stardance.hackclub.com/projects/27126', '_blank')">

            </div>

        </div>

        
    <!-- javascript -->
     <script>
        const input = document.querySelector("input[type='text']"); //handle the input, as we want to expand it
        
        function resizeInput() {
            //use a ruler to prevent css from affecting the width
            const ruler = document.createElement("span");

            ruler.style.position = "absolute";
            ruler.style.visibility = "hidden";
            ruler.style.whiteSpace = "pre";
            ruler.style.font = getComputedStyle(input).font;
            ruler.textContent = input.value || input.placeholder;

            document.body.appendChild(ruler);
            const width = ruler.getBoundingClientRect().width;

            ruler.remove();

            input.style.width = `${width + 40}px`; 
        }

        input.addEventListener("input", resizeInput);
        window.addEventListener("resize", resizeInput);

        resizeInput(); //initial resize

            //now assign it
            const poetry = document.getElementById("Poetry"); //create a listener
        
            async function generatePoem(event) {
                event.preventDefault(); //dont reload
                
                const form = event.target;
                const word = form.word.value; //grab the value
                
                try { //try to send a request, and grab it
                    const response = await fetch("/generate", { //hold the response
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({word: word}) //stringify the data
                    });

                    if(!response.ok) {throw new Error("ERROR");} //if we get something, but isnt right

                    const data = await response.json(); //wait for our data

                    output = data.output; //update the data

                    poetry.textContent = output; //update the veiw
                    document.querySelector(".copy-container").style.display = "flex"; //show the copy button    
                } catch (error) { //if we get an error overall
                    console.error("Something went wrong: ", error); 
                    poetry.textContent = "Something went wrong :("
                    document.querySelector(".copy-container").style.display = "none"; //hide the copy button 
                }
            }

            //handle the copy + paste stuff
            function copyToClipboard() {
                const textToCopy = document.getElementById("Poetry").textContent;
                const button = document.querySelector(".copy-container button");

                navigator.clipboard.writeText(textToCopy)
                    .then(() => {
                        console.log("Text copied to clipboard:", textToCopy);
                       
                        button.style.color = "#33cc33";
                        setTimeout(() => {
                            button.style.color = ""; // Reset color after 700 ms
                        }, 700);
                    })
                    .catch((error) => {
                        console.error("Failed to copy text:", error);
                        button.style.color = "#ff0000";
                        setTimeout(() => {
                            button.style.color = ""; // Reset color after 700 ms
                        }, 700);
                });
            }
     </script>
    </body>
</html>
